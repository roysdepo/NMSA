version: 2
updates:
  - package-ecosystem: npm
    directory: /source
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      javascript-dependencies:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /source
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dotnet-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
